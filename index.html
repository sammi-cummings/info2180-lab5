<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>World Database Lookup</title>

		<!-- you can modify this as needed or to your preference -->

		<!-- you write this -->

	<body>
		<header>
			<img src ='pngtree-world-globe-line-art-png-image_11488273.png' width ='200px' height='200px' alt="World"/>

		</header>

		<main>
			<div id="controls">
				<label for="country" id="countrylabel">Country</label>
				<input id="country" type="search" name="country" placeholder="Enter country name" />

				<button id ="lookup-cities">Lookup Cities</button>

			<div id="result">
				<!-- countries will appear here -->
			</div>
		</main>
